[package]
name = "coforge-installer"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "The CoForge Computer installer, released as its own native binary"

[dependencies]
flate2 = "1"
lexopt = "0.3"
rusqlite = { version = "0.40.2", features = ["bundled"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# No default features: the default `gzip` feature makes ureq send Accept-Encoding and decode
# Content-Encoding transparently, but the manifest checksum is over the exact wire bytes.
# `rustls` = rustls with the ring provider and the webpki-roots (Mozilla) trust store.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# NTFS junctions, for the `active` link on Windows (no elevation, unlike a symlink). Pinned: 1.3
# and later need windows-sys >= 0.59, but ring (through rustls) uses 0.52 and deny.toml denies
# two versions of a crate. Move both together.
[target."cfg(windows)".dependencies]
junction = { version = "=1.2.0", default-features = false }
# Process inspection and termination (src/processes). 0.52 is the version ring uses; deny.toml
# denies two, so this moves with junction and ring, never alone.
windows-sys = { version = "0.52", default-features = false, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

# Signals and the macOS process table (src/processes). Already in the graph through ring.
[target."cfg(unix)".dependencies]
libc = { version = "0.2", default-features = false }
